  #detail .d-id{font-size:12px;color:#C9A96E;letter-spacing:3px;}
  #detail .d-name{font-size:21px;font-weight:bold;margin-top:6px;line-height:1.4;font-family:"STSong","SimSun",serif;}

  #detail .d-tag{font-size:11px;border:1px solid #A8503A;color:#E6C56A;padding:3px 9px;border-radius:2px;}
  #detail .d-meta{margin-top:14px;font-size:13px;line-height:1.9;color:#D9C9A0;}

  #loading{position:fixed;inset:0;z-index:100;background:#1a0e06;display:flex;align-items:center;justify-content:center;color:#C9A96E;font-size:14px;letter-spacing:4px;}
</style>
</head>

/* 程序化石材地面纹理(砖缝+噪点+微渐变) */
function makeStoneTex(){
  const S=512, c=document.createElement('canvas'); c.width=S; c.height=S;
  const x=c.getContext('2d');
  x.fillStyle='#B89878'; x.fillRect(0,0,S,S);
  // 每块砖 128x64 错缝排列
  for(let r=0;r<8;r++){
    const off=(r%2)*64;
    for(let col=-1;col<5;col++){
      const bx=col*128+off, by=r*64;
      const l=18+Math.floor(Math.random()*16);
      x.fillStyle='rgb('+(168+l)+','+(140+l*0.7|0)+','+(108+l*0.5|0)+')';
      x.fillRect(bx+2,by+2,124,60);
      // 砖面噪点
      for(let n=0;n<46;n++){
        const px=bx+2+Math.random()*124, py=by+2+Math.random()*60;
        const v=Math.random()*36-18|0;
        x.fillStyle='rgba('+(178+v)+','+(150+v*0.7|0)+','+(118+v*0.5|0)+',0.30)';
        x.fillRect(px,py,2,2);
      }
    }
  }
  // 砖缝
  x.strokeStyle='rgba(80,56,36,0.55)'; x.lineWidth=2.0;
  for(let r=0;r<=8;r++){ x.beginPath(); x.moveTo(0,r*64); x.lineTo(S,r*64); x.stroke(); }
  for(let r=0;r<8;r++){ const off=(r%2)*64; for(let col=0;col<=4;col++){ const bx=col*128+off; x.beginPath(); x.moveTo(bx,r*64); x.lineTo(bx,r*64+64); x.stroke(); } }
  // 微渐变(中间略亮)
  const g=x.createRadialGradient(S/2,S/2,60,S/2,S/2,S*0.7);
  g.addColorStop(0,'rgba(255,230,190,0.10)'); g.addColorStop(1,'rgba(0,0,0,0.16)');
  x.fillStyle=g; x.fillRect(0,0,S,S);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(10,5); t.anisotropy=8; t.colorSpace=THREE.SRGBColorSpace;
  return t;
}

function makeCeilTex(){
  const S=256, c=document.createElement('canvas'); c.width=S; c.height=S;
  const x=c.getContext('2d');
  x.fillStyle='#2a1c12'; x.fillRect(0,0,S,S);
  x.fillStyle='#3e2a1a'; x.fillRect(20,20,S-40,S-40);
  for(let i=0;i<140;i++){ const py=Math.random()*S; x.fillStyle='rgba('+(64+Math.random()*34|0)+','+(46+Math.random()*22|0)+','+(28+Math.random()*16|0)+',0.28)'; x.fillRect(0,py,S,1.5); }
  x.strokeStyle='#8a6a3a'; x.lineWidth=4; x.strokeRect(20,20,S-40,S-40);
  x.strokeStyle='#C9A96E'; x.lineWidth=1.6; x.strokeRect(31,31,S-62,S-62);
  x.strokeStyle='rgba(201,169,110,0.5)'; x.lineWidth=2;
  x.beginPath(); x.arc(S/2,S/2,30,0,Math.PI*2); x.stroke();
  x.beginPath(); x.moveTo(S/2-36,S/2); x.lineTo(S/2+36,S/2); x.moveTo(S/2,S/2-36); x.lineTo(S/2,S/2+36); x.stroke();
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(16,8); t.anisotropy=8; t.colorSpace=THREE.SRGBColorSpace;
  return t;
}

      new THREE.TorusGeometry(0.74, 0.022, 14, 64),
      new THREE.MeshStandardMaterial({color:0xC9A96E, emissive:0xC9A96E, emissiveIntensity:1.2})
    );
    ring.rotation.x = -Math.PI/2; ring.position.y = 0;
    this.turntable.add(ring);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(1.5, 48),
      new THREE.MeshStandardMaterial({color:0x0a0604, roughness:0.95})
    );
    ground.rotation.x = -Math.PI/2; ground.position.y = -0.05; ground.receiveShadow = true;
    this.scene.add(ground);

    this.model = null;
    this.resize();
  }

  resize(){
    const w = this.canvas.clientWidth || 350;
    const h = this.canvas.clientHeight || 230;
    this.renderer.setSize(w, h, false);
    this.camera.aspect = w / h;
    this.camera.updateProjectionMatrix();
  }

  setExhibit(d){
    if (this.model){
      this.turntable.remove(this.model);
      this.model.traverse(o => {
        if (o.geometry) o.geometry.dispose();
        if (o.material) { if (Array.isArray(o.material)) o.material.forEach(m=>m.dispose()); else o.material.dispose(); }
      });
      this.model = null;
    }

    let model;
    if (d.type === 'mural' || d.kind === 'mural2'){
      model = new THREE.Group();
      const fw = d.kind === 'mural2' ? 0.95 : 1.25, fh = d.kind === 'mural2' ? 1.25 : 0.88;
      const frame = new THREE.Mesh(
        new THREE.BoxGeometry(fw + 0.09, fh + 0.09, 0.07),
        new THREE.MeshStandardMaterial({color:0x5a3a1a, roughness:0.5, metalness:0.4})
      );
      frame.castShadow = true; frame.receiveShadow = true;
      model.add(frame);
      const plane = new THREE.Mesh(
        new THREE.PlaneGeometry(fw, fh),
        new THREE.MeshStandardMaterial({map: loadTex(d.img), roughness:0.55, metalness:0.05})
      );
      plane.position.z = 0.04; plane.castShadow = true;
      model.add(plane);
    } else {
      model = buildObject(d.kind, d.hi);
    }
    model.traverse(o => { if (o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });

    this.turntable.add(model);
    this.model = model;

    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    model.position.x -= center.x;
    model.position.z -= center.z;
    model.position.y -= (box.min.y - 0.02);

    const cy = 0.02 + size.y * 0.5;
    const dist = Math.max(size.x, size.y, size.z) * 1.6 + 1.3;
    this.controls.target.set(0, cy, 0);
    this.camera.position.set(0, cy, dist);
    this.controls.update();
  }

  setAuto(on){ this.controls.autoRotate = on; }
  setSpeed(s){ this.controls.autoRotateSpeed = s; }
  resetView(){
    if (!this.model) return;
    const box = new THREE.Box3().setFromObject(this.model);
    const size = box.getSize(new THREE.Vector3());
    const cy = 0.02 + size.y * 0.5;
    const dist = Math.max(size.x, size.y, size.z) * 1.6 + 1.3;
    this.controls.target.set(0, cy, 0);
    this.camera.position.set(0, cy, dist);
    this.controls.update();
  }

  render(){
    this.controls.update();
    this.renderer.render(this.scene, this.camera);
  }
}

/* 可见光锥(体积光效·顶点色纵向衰减) */
let hiRing=null, hiSpot=null;
function lightCone(x,y,z,tx,ty,tz,r,op,color){
  const dx=x-tx, dy=y-ty, dz=z-tz;
  const len=Math.sqrt(dx*dx+dy*dy+dz*dz);
  const g=new THREE.ConeGeometry(r,len,24,8,true);
  g.translate(0,-len/2,0);
  // 顶点色:光源端满色,底端衰减为黑(additive下即不可见)
  const pos=g.attributes.position, col=[];
  const base=new THREE.Color(color||0xFFE6B0);
  for(let i=0;i<pos.count;i++){
    const f=Math.max(0,Math.min(1,1-(-pos.getY(i)/len)));
    const a=f*f*0.85+0.15*f;
    col.push(base.r*a,base.g*a,base.b*a);
  }
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  const m=new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,fog:false});
  const cone=new THREE.Mesh(g,m);
  cone.position.set(x,y,z);
  cone.lookAt(tx,ty,tz);
  cone.rotateX(-Math.PI/2);
  scene.add(cone);
  return cone;
}

const mapNodes=[[0.12,0.78,0.78],[0.3,0.66,0.7],[0.5,0.55,0.6],[0.82,0.2,0.2]];
function drawMap(){
  const g=mc.createLinearGradient(0,0,512,0); g.addColorStop(0,'#3a2418'); g.addColorStop(0.5,'#A8503A'); g.addColorStop(1,'#C9A96E');
  mc.fillStyle=g; mc.fillRect(0,0,512,512);
  mc.strokeStyle='rgba(245,230,200,0.4)'; mc.lineWidth=4; mc.beginPath();
  mc.moveTo(mapNodes[0][0]*512,mapNodes[0][1]*512);
  for(let i=1;i<mapNodes.length;i++) mc.lineTo(mapNodes[i][0]*512,mapNodes[i][1]*512); mc.stroke();
  mapNodes.forEach(n=>{ mc.beginPath(); mc.arc(n[0]*512,n[1]*512,7,0,Math.PI*2); mc.fillStyle='#F5E6C8'; mc.fill(); });
  for(let k=0;k<3;k++){
    const ph=(mapDotPhase+k/3)%1;
    const seg=ph*(mapNodes.length-1); const i=Math.floor(seg); const f=seg-i;
    const a=mapNodes[i], b=mapNodes[Math.min(i+1,mapNodes.length-1)];
    const px=(a[0]+(b[0]-a[0])*f)*512, py=(a[1]+(b[1]-a[1])*f)*512;
    mc.beginPath(); mc.arc(px,py,9,0,Math.PI*2); mc.fillStyle='rgba(255,230,150,0.95)'; mc.fill();
    mc.beginPath(); mc.arc(px,py,16,0,Math.PI*2); mc.fillStyle='rgba(255,200,100,0.25)'; mc.fill();
  }
  mc.fillStyle='#F5E6C8'; mc.font='bold 48px "Microsoft YaHei"'; mc.textAlign='center'; mc.fillText('丝绸之路',256,60);
  mc.font='24px "Microsoft YaHei"'; mc.fillText('长安 → 河西 → 西域 → 波斯 → 罗马',256,480);
  mapTex.needsUpdate=true;
}

/* ============ 点击交互 ============ */
const raycaster=new THREE.Raycaster();
const mouseNDC=new THREE.Vector2();
renderer.domElement.addEventListener('mousemove',e=>{const r=renderer.domElement.getBoundingClientRect(); mouseNDC.x=((e.clientX-r.left)/r.width)*2-1; mouseNDC.y=-((e.clientY-r.top)/r.height)*2+1;});
renderer.domElement.addEventListener('click',()=>{
  if(mode==='free' && plControls.isLocked) return;
  raycaster.setFromCamera(mouseNDC,camera);
  const hits=raycaster.intersectObjects(clickables,true);
  if(hits.length){
    let o=hits[0].object;
    while(o && !o.userData.exId && !o.userData.interact) o=o.parent;
    if(o && o.userData.exId){ openDetail(o.userData.exId); return; }
    if(o && o.userData.interact){ doInteract(o.userData.interact); return; }
  }
  if(mode==='free' && !plControls.isLocked) plControls.lock();
});

/* ============ 详情面板 ============ */
function openDetail(id){
  const d=EX.find(e=>e.id===id); if(!d) return;
  currentExhibit=d;
  stopNarration();
  $('dImg').src=d.img;
  $('dId').textContent='展品 No.'+d.id;
  $('dName').textContent=d.name;
  $('dTags').innerHTML='<span class="d-tag">'+d.era+'</span>'+(d.coll&&d.coll!=='—'?'<span class="d-tag">'+d.coll+'</span>':'');
  $('dMeta').innerHTML='<b>时代</b>'+d.era+'<br><b>出处</b>'+d.origin+(d.coll&&d.coll!=='—'?'<br><b>收藏</b>'+d.coll:'');

/* ============ 互动区交互 ============ */
let camelBob=0;
function doInteract(t){
  if(t==='trade'){ tradeIdx=(tradeIdx+1)%tradeStates.length; (tradeScreen.material.map=tradeTex()).needsUpdate=true; toast('切换：'+tradeStates[tradeIdx][0]); }
  else if(t==='camel'){ camelBob=1.0; playBell(); toast('驼队启程 · 叮铃～'); }
  else if(t==='instrument'){ playPluck(); toast('西域弦音 ～'); }
}
function toast(msg){ const el=$('toast'); el.textContent=msg; el.style.display='block'; clearTimeout(el._t); el._t=setTimeout(()=>el.style.display='none',1400); }

/* ============ 音频 (WebAudio) ============ */
let actx=null, ambientOn=false, ambientNodes=[], ambAudio=null;
function ensureAudio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx&&actx.state==='suspended') actx.resume(); }
function playBell(){
  ensureAudio(); if(!actx)return;
  [880,1320].forEach((f,i)=>{ const o=actx.createOscillator(),g=actx.createGain(); o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(actx.destination); const t=actx.currentTime; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.18,t+0.01); g.gain.exponentialRampToValueAtTime(0.001,t+1.4); o.start(t); o.stop(t+1.5); });
}
function playPluck(){
  ensureAudio(); if(!actx)return;
  const o=actx.createOscillator(),g=actx.createGain(); o.type='triangle'; o.frequency.value=330; o.connect(g); g.connect(actx.destination); const t=actx.currentTime; g.gain.setValueAtTime(0.2,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.5); o.start(t); o.stop(t+0.5);
}
function setAmbient(on){
  if(!ambAudio){ ambAudio=new Audio('media/ambient.mp4'); ambAudio.loop=true; ambAudio.volume=0.55; }
  if(on){ ambientOn=true; ambAudio.play().catch(()=>{}); $('btnSound').textContent='♪ 氛围音 开'; }
  else { ambientOn=false; ambAudio.pause(); $('btnSound').textContent='♪ 氛围音 关'; }
}

/* ============ 模式 / UI ============ */
let mode='auto';
function $(id){return document.getElementById(id);}
function setMode(m){ mode=m; $('btnAuto').classList.toggle('active',m==='auto'); $('btnFree').classList.toggle('active',m==='free');
  if(m==='auto'){ if(plControls.isLocked)plControls.unlock(); $('lockhint').style.display='none'; }
  else { $('lockhint').style.display='block'; } }
function start(m){ ensureAudio(); $('intro').style.display='none'; $('topbar').style.display='flex'; $('zoneHint').style.display='block'; $('minimap').style.display='block'; $('loading').style.display='none'; setMode(m); }
$('enterAuto').addEventListener('click',()=>start('auto'));
$('enterFree').addEventListener('click',()=>start('free'));
$('btnAuto').addEventListener('click',()=>setMode('auto'));
$('btnFree').addEventListener('click',()=>setMode('free'));
$('btnSound').addEventListener('click',()=>setAmbient(!ambientOn));
plControls.addEventListener('lock',()=>{ $('lockhint').style.display='none'; });
plControls.addEventListener('unlock',()=>{ if(mode==='free')$('lockhint').style.display='block'; });

/* ============ 分区提示 ============ */
function updateZone(){
  const x=camera.position.x; const z=ZONES.find(zd=>x>=zd.x0&&x<zd.x1)||ZONES[0];
  $('zName').textContent=z.name; $('zArea').textContent=z.area; $('zProg').style.width=(x/W*100).toFixed(1)+'%';
}

/* ============ 小地图 ============ */
const mm=$('mm'), mctx=mm.getContext('2d');
function drawMap2D(){
  const w=mm.width,h=mm.height; mctx.clearRect(0,0,w,h);
  mctx.fillStyle='#1a0e06'; mctx.fillRect(0,0,w,h);
  ZONES.forEach(z=>{ mctx.fillStyle='rgba('+[(z.fc>>16)&255,(z.fc>>8)&255,z.fc&255].join(',')+',0.55)'; mctx.fillRect(z.x0/W*w,0,(z.x1-z.x0)/w*1,h); });
  mctx.strokeStyle='#E6C56A'; mctx.lineWidth=2; mctx.beginPath();
  trailPts.forEach((p,i)=>{ const px=p.x/W*w, py=p.z/D*h; i?mctx.lineTo(px,py):mctx.moveTo(px,py); }); mctx.stroke();
  EX.forEach(d=>{ let x,z; if(d.type==='mural'){x=d.pos[0];z=d.wall==='north'?0.4:19.6;} else if(d.kind==='mural2'){x=d.pos[0];z=d.pos[2];} else {x=d.ped[0];z=d.ped[1];}
    mctx.fillStyle=d.hi?'#E6C56A':'#F5E6C8'; mctx.beginPath(); mctx.arc(x/W*w,z/D*h,d.hi?4:3,0,Math.PI*2); mctx.fill(); });
  mctx.fillStyle='#E6C56A'; mctx.fillRect(0,h/2-6,4,12); mctx.fillStyle='#B5C9C2'; mctx.fillRect(w-4,h/2-6,4,12);
  const cx=camera.position.x/W*w, cz=camera.position.z/D*h;
  const fwd=new THREE.Vector3(); camera.getWorldDirection(fwd);
  mctx.save(); mctx.translate(cx,cz); mctx.rotate(Math.atan2(fwd.x,fwd.z));
  mctx.fillStyle='#FF5A3A'; mctx.beginPath(); mctx.moveTo(0,-6); mctx.lineTo(4,5); mctx.lineTo(-4,5); mctx.closePath(); mctx.fill(); mctx.restore();
  mctx.strokeStyle='#C9A96E'; mctx.strokeRect(0.5,0.5,w-1,h-1);
}

/* ============ 主循环 ============ */
const clock=new THREE.Clock(); let started=false;
function animate(){
  requestAnimationFrame(animate);
  const delta=clock.getDelta();
  if(!started){started=true; $('loading').style.display='none';}
  mapDotPhase=(mapDotPhase+delta*0.18)%1; drawMap();
  labels.forEach(l=>{ const dist=camera.position.distanceTo(l.position); const s=Math.min(2.8,Math.max(1.0,dist*0.16)); l.scale.set(s,s*0.333,1); l.material.opacity=Math.max(0,Math.min(1,(16-dist)/5)); });
  clickables.forEach(o=>{ if(o.userData&&o.userData.spin){ o.rotation.y+=delta*0.5; } });
  if(camelBob>0){ camelBob=Math.max(0,camelBob-delta*2); padCamel.position.y=1.0+Math.sin(camelBob*Math.PI*4)*0.12*camelBob; }
  if(mode==='auto'&&!tourPaused){
    autoT+=tourDir*delta/TOUR_DUR;
    if(autoT>=1){autoT=1;tourDir=-1;} else if(autoT<=0){autoT=0;tourDir=1;}
    const t=Math.max(0.001,Math.min(0.999,autoT));
    camera.position.copy(posCurve.getPointAt(t));
    camera.lookAt(lookCurve.getPointAt(t));
  } else if(mode==='free'&&plControls.isLocked){
    const sp=3.0*delta;
    if(keys.w)plControls.moveForward(sp); if(keys.s)plControls.moveForward(-sp);
    if(keys.a)plControls.moveRight(-sp); if(keys.d)plControls.moveRight(sp);
    const pp=camera.position;
    obstacles.forEach(o=>{ const dx=pp.x-o.x, dz=pp.z-o.z; const d=Math.sqrt(dx*dx+dz*dz); if(d<o.r){ const push=(o.r-d); pp.x+=dx/d*push; pp.z+=dz/d*push; } });
    pp.x=Math.max(0.6,Math.min(39.4,pp.x)); pp.z=Math.max(0.4,Math.min(19.6,pp.z)); pp.y=EYE;
  }
  // 银壶呼吸:LED环脉动 + 射灯随观众距离渐增
  const tNow=clock.elapsedTime;
  if(hiRing||hiSpot){
    const dx=camera.position.x-11, dz=camera.position.z-5;
    const dist=Math.sqrt(dx*dx+dz*dz);
    const kk=Math.max(0,Math.min(1,1-dist/6.5));
    if(hiRing){ hiRing.material.emissiveIntensity=0.7+0.5*Math.sin(tNow*2.2)+0.6*kk; }
    if(hiSpot){ hiSpot.intensity=12*(0.7+0.55*kk)+1.2*Math.sin(tNow*2.2)*kk; }
  }
  // 尘埃粒子慢速飘动
  if(dust){
    const pos=dust.geometry.attributes.position.array;
    for(let i=0;i<dustCount;i++){
      pos[i*3]+=Math.sin(tNow*0.4+i)*0.0008;
      pos[i*3+1]+=Math.sin(tNow*0.25+i*0.7)*0.0004;
      pos[i*3+2]+=dustSpd[i]*0.003;
      if(pos[i*3+2]>D) pos[i*3+2]=0;
    }
    dust.geometry.attributes.position.needsUpdate=true;
    dust.material.opacity=0.38+0.15*Math.sin(tNow*0.7);
  }
  // 宫灯光晕呼吸
  lanterns.forEach((l,i)=>{
    const halo=l.children[l.children.length-1];
    if(halo){ halo.material.opacity=0.55+0.25*Math.sin(tNow*1.8+i*0.9); }
  });
  // 动线箭头流动呼吸
  arrows.forEach((a,i)=>{
    a.material.opacity=0.16+0.46*Math.max(0,Math.sin(tNow*1.4-i*0.42));
  });
  updateZone(); drawMap2D();
  composer.render();
  if($('detail').style.display==='flex'){ detailViewer.render(); }
}
animate();

addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight); bloomPass.resolution.set(innerWidth,innerHeight); detailViewer.resize(); });
